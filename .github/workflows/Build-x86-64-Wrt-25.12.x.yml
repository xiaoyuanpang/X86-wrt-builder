name: 📦 Build x86-64 Wrt-25.12.x

on:
  workflow_dispatch:
    inputs:
      wrt_version:
        description: "选择OpenWrt/Immortalwrt"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - 'immortalwrt'
          - 'openwrt'
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.6"
        type: choice
        options:
          - '25.12.0'
          - '25.12.1'
          - '25.12.2'
          - '25.12.3'
          - '25.12.4'
          - '25.12.5'
          - '25.12.6'
      ipaddr:
        description: "请设置软路由的管理地址,格式:192.168.x.1"
        required: true
        default: "192.168.11.1"
      rootfs_partsize:
        description: '设置软件包大小 单位(MB)'
        required: true
        default: '2048'
        type: choice
        options:
          - '256'
          - '512'
          - '1024'
          - '2048'
          - '3072'
          - '4096'
          - '8192'
      include_docker:
        description: "是否集成 Docker 插件"
        required: true
        default: "no"
        type: choice
        options:
          - 'yes'
          - 'no'

env:
  # 判断：如果是 immortalwrt，且版本在 25.12.3 至 25.12.6 之间，则强制降级为 25.12.2；否则保持用户选择
  FINAL_LUCI_VER: ${{ (inputs.wrt_version == 'immortalwrt' && contains(fromJSON('["25.12.3", "25.12.4", "25.12.5", "25.12.6"]'), inputs.luci_version)) && '25.12.2' || inputs.luci_version }}
  FINAL_WRT: ${{ inputs.wrt_version }}
  WRT_NAME: ${{ (inputs.wrt_version == 'openwrt') && 'OpenWrt' || 'ImmortalWrt' }}
  ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
  DOCKER: ${{ inputs.include_docker }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ 设置可执行权限
        run: |
          chmod +x x86/build25.sh
          chmod +x x86/immortalwrt-repositories
          chmod +x x86/openwrt-repositories   
          chmod +x shell/*.sh

      - name: 🛠️ 安装依赖
        run: |      
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zstd curl unzip tree qemu-utils genisoimage

      - name: ⚙️ 设置IP、网关和版本号
        run: |
          CONFIG_PATH="./files/uci-defaults/99-custom.sh"
          BANNER_PATH="./files/etc/banner"
          echo "当前网络配置路径: $CONFIG_PATH"
          # 1. 替换 IP
          sed -i "s/__IPADDR__/${{ inputs.ipaddr }}/g" "$CONFIG_PATH"
          # 2. 替换 系统名称
          sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$CONFIG_PATH"
          # 3. 替换 版本号
          sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$CONFIG_PATH"
          echo "✅ 配置修改完成，输出预览："
          cat "$CONFIG_PATH"
          # 4. 替换 banner 信息（只有文件存在时才执行替换与预览））
          if [ -f "$BANNER_PATH" ]; then
            echo "当前banner配置路径: $BANNER_PATH"
            sed -i "s/VERXXXX/${{ env.FINAL_LUCI_VER }}/g" "$BANNER_PATH"
            sed -i "s/WRTVERSIONINFO/${{ env.WRT_NAME }}/g" "$BANNER_PATH"
            echo "✅ banner配置修改完成，输出预览："
            cat "$BANNER_PATH"
          else
            echo "⚠️ 未找到 banner 文件，跳过替换。"
          fi

      - name: ⏬ 下载 ${{ env.FINAL_WRT }} ImageBuilder 25.12.x
        run: |
          URL="https://downloads.${{ env.FINAL_WRT }}.org/releases/${{ env.FINAL_LUCI_VER }}/targets/x86/64/${{ env.FINAL_WRT }}-imagebuilder-${{ env.FINAL_LUCI_VER }}-x86-64.Linux-x86_64.tar.zst"
          curl -Lf -o imagebuilder.tar.zst "$URL"
          tar --use-compress-program=unzstd -xvf imagebuilder.tar.zst
          mv -- ${{ env.FINAL_WRT }}-imagebuilder-* imagebuilder
          echo "✅ ImageBuilder 下载完成"

      - name: 🔄 复制${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-ImageBuilder
        run: |
          cp x86/build25.sh imagebuilder/
          if [ "${{ env.FINAL_WRT }}" = "openwrt" ]; then
            cp x86/openwrt-repositories imagebuilder/repositories
            cat shell/apk-openwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          else
            cp x86/immortalwrt-repositories imagebuilder/repositories
            cat shell/apk-immortalwrt-custom-packages.sh >> imagebuilder/apk-custom-packages.sh
          fi          
          chmod +x imagebuilder/apk-custom-packages.sh
          cp shell/prepare-packages.sh imagebuilder/
          mkdir -p imagebuilder/files/etc/uci-defaults imagebuilder/files/etc/apk/repositories.d
          cp files/uci-defaults/99-custom.sh imagebuilder/files/etc/uci-defaults/
          cp files/etc/banner imagebuilder/files/etc/
          # 追加自定义源到 APK repositories（FIRMWARE 内 /etc/apk/repositories 会用这个）
          cat files/customfeeds/25.customfeeds.list >> imagebuilder/files/etc/apk/repositories.d/customfeeds.list
          echo "✅ 文件准备完成"

      - name: ⚙️ 动态获取 Kmod 哈希并更新配置
        run: |
          BASE_URL="https://downloads.${{ env.FINAL_WRT }}.org/releases/${{ env.FINAL_LUCI_VER }}/targets/x86/64/kmods/" 
          echo "正在从 $BASE_URL 获取最新的内核哈希..."
          KMOD_DIR=$(curl -sL $BASE_URL | grep -oE "[0-9.-]+-[a-f0-9]{32}" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            FULL_KMOD_URL="${BASE_URL}${KMOD_DIR}/packages.adb"
            echo "✅ 成功匹配 kmods 路径: $FULL_KMOD_URL"
            # 替换 repositories 文件中的占位符
            sed -i "s|VERSION_PLACEHOLDER|${{ env.FINAL_LUCI_VER }}|g" imagebuilder/repositories
            sed -i "s|KMOD_PLACEHOLDER|${FULL_KMOD_URL}|g" imagebuilder/repositories
          else
            echo "❌ 无法获取 Kmod 哈希"
            exit 1
          fi
          if [ -f "imagebuilder/Makefile" ]; then
            echo "🛠️ 正在给 ImageBuilder 的 wget 加上重试机制..."
            sed -i 's/wget /wget --tries=5 --timeout=20 --waitretry=3 /g' imagebuilder/Makefile
          fi
          echo "=== repositories 内容 ==="
          cat imagebuilder/repositories
         
      - name: 🧱 构建 ${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }} 固件
        working-directory: ./imagebuilder
        env:
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
        run: |
          bash ./build25.sh

      - name: 📅 获取当前日期
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: 📜 生成发布说明
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          📌 版本： ${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}
          🏠 后台地址： ${{ inputs.ipaddr }}
          👤 用户名： root
          🔑 密码： 无
          🐳 Docker状态： ${{ inputs.include_docker == 'yes' && '已集成' || '未集成' }}
          EOF

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ steps.date.outputs.date }}-${{ env.FINAL_WRT }}-${{ env.FINAL_LUCI_VER }}-x86-64-RELEASE-Docker-${{ inputs.include_docker }}
          body_path: ${{ github.workspace }}/router-info.md
          overwrite: true
          files: |
            imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
